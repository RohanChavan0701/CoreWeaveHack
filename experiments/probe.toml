# The contract probe: one real model through every step of the loop on a small suite, four passes,
# consolidation every two — enough for a decision admitted at the first consolidation to be consulted,
# guarded, disposed and credited by the third pass. Not an experiment about the model: about the
# role contracts, read back through the reply log.
name = "probe"
description = "every role request on a real model, end to end, on the hand-written families"
weave_project = "hgi-dev"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[defaults]
model = "gpt-oss-120b"
rounds = 2
passes_per_round = 2
concurrency = 4

[defaults.suite]
families = ["genesis", "conventions"]

[defaults.suite.faults]
http_fault_calls = 2

[arms.attached]
mode = "attached"
