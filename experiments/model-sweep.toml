# Behaviour under a model swap — the thing § 14.4 says the demonstration does not show. Three
# models of three sizes, each with the memory attached and detached, plus one arm that splits
# the roles: a small model acts, a larger one consolidates, examines and adjudicates (§ 9.6:
# four contexts, one model or several). Every arm is 3 rounds × 2 passes.
#
# Ids are W&B Inference ids as listed on 2026-09-12; `hgi experiment models` lists today's.
name = "model-sweep"
description = "the same run across model sizes, and the roles split across two"
weave_project = "hgi-experiments"

[models.gpt-oss-20b]
id = "openai/gpt-oss-20b"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[models.qwen3-35b]
id = "Qwen/Qwen3.6-35B-A3B"

[defaults]
rounds = 3
passes_per_round = 2
concurrency = 4

[arms.20b-attached]
model = "gpt-oss-20b"
[arms.20b-detached]
model = "gpt-oss-20b"
mode = "detached"

[arms.120b-attached]
model = "gpt-oss-120b"
[arms.120b-detached]
model = "gpt-oss-120b"
mode = "detached"

[arms.qwen-attached]
model = "qwen3-35b"
[arms.qwen-detached]
model = "qwen3-35b"
mode = "detached"

[arms.split-roles]
model = "gpt-oss-20b"
description = "the pass on the small model; the backward pass and the blind coder on the large one"
[arms.split-roles.roles]
consolidator = "gpt-oss-120b"
examiner = "gpt-oss-120b"
adjudicator = "gpt-oss-120b"
coder = "gpt-oss-120b"
