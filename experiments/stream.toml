# The stream: the loop meets unseen tasks in progression. The curriculum's 84 tasks — seven lessons of the world in
# twelve clothes each — are dealt into ten batches of eight, balanced over lessons; pass k evaluates batch k at first
# sight, closes, and consolidates every two batches, so every batch is a validation set once and training afterwards.
# The detached arm meets the same batches with no store, so the comparison is paired per batch and per lesson. Two
# batches are met again after the stream by the attached arm, which measures retention against transfer. The world
# faults nothing: the lessons are the conventions alone. The evolution log beside each arm reads the per-lesson
# same-shape recurrence off the naive outcomes.
#
# Ids are W&B Inference ids as listed on 2026-09-12; `hgi experiment models` lists today's.
name = "stream"
description = "first-sight performance on unseen tasks as the store grows, attached against detached, per lesson"
weave_project = "hgi-experiments"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[models.gpt-oss-20b]
id = "openai/gpt-oss-20b"

[defaults]
model = "gpt-oss-120b"
passes_per_round = 2
concurrency = 6

[defaults.stream]
families = ["curriculum"]
batch = 8
batches = 10
seed = 0
revisit = [1, 2]

[defaults.stream.faults]
http_fault_fraction = 0.0

[arms.120b-attached]
mode = "attached"

[arms.120b-detached]
mode = "detached"
description = "the ablation on the same batches; one run is the whole record"

[arms.20b-attached]
model = "gpt-oss-20b"
description = "a weaker actor on the same stream, likelier to miss the loud lessons on first contact"

# The strict pool: the same clothes budgeted at exactly the knowing policy's calls, so the convention costs a call the
# budget does not hold. A pass that discovers it (a cat before the count, the first page before the walk) is over budget;
# only a pass that already knows it — from the store, or from the model — passes. The knowledge-base question directly.
[arms.120b-strict]
mode = "attached"
description = "the strict pool: does the memory save the discovery call"
[arms.120b-strict.stream]
families = ["curriculum-strict"]

[arms.120b-strict-detached]
mode = "detached"
description = "the strict pool's ablation"
[arms.120b-strict-detached.stream]
families = ["curriculum-strict"]

# The seeded twins: the same arms started from experiments/seeds/conventions — the seven lessons already admitted —
# against the unseeded arms above on the same batches. What the injected lessons buy, paired per batch.
[arms.120b-seeded]
mode = "attached"
seed = "conventions"
description = "gpt-oss-120b from the seed store: every lesson of the world already admitted"

[arms.120b-strict-seeded]
mode = "attached"
seed = "conventions"
description = "the strict pool from the seed store: does the injected lesson save the discovery call"
[arms.120b-strict-seeded.stream]
families = ["curriculum-strict"]
