# A world the model cannot already handle: the hand-written conventions, MBPP's write-and-run tasks,
# TableBench through a file and through a paged API, under a harder fault profile (the first two HTTP
# calls of a faulted task fail). Breadth first: a pass sees enough distinct forks that one round can
# hold two independent observations of the same shape. Attached arms lead; one detached arm is the
# ablation for the suite and needs no rerun — with no store it sees the same world every time.
#
# Ids are W&B Inference ids as listed on 2026-09-12; `hgi experiment models` lists today's.
name = "world"
description = "memory attached against detached on a broad suite with world conventions and harder faults"
weave_project = "hgi-experiments"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[models.gpt-oss-20b]
id = "openai/gpt-oss-20b"

[defaults]
model = "gpt-oss-120b"
rounds = 3
passes_per_round = 2
concurrency = 4

[defaults.suite]
families = ["genesis", "conventions", "mbpp", "tables", "api"]
size = 12
seed = 0

[defaults.suite.faults]
http_fault_calls = 2

[arms.120b-attached]
mode = "attached"

[arms.120b-detached]
mode = "detached"
description = "the ablation on this suite; one run is the whole record"

[arms.20b-attached]
model = "gpt-oss-20b"
description = "a weaker actor on the same world"

[arms.split-roles]
model = "gpt-oss-20b"
description = "the weak actor with the strong backward pass: does separation of powers let it learn from a stronger judge"
[arms.split-roles.roles]
consolidator = "gpt-oss-120b"
examiner = "gpt-oss-120b"
adjudicator = "gpt-oss-120b"
coder = "gpt-oss-120b"
