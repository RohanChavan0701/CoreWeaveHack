# The stream graded on quality, not correctness alone. Where a model passes a lesson at first contact, the memory's
# value is not the pass but the cost: a pass that knows the convention spends the knowing policy's calls and turns
# and its method carries to the task's twin world; one that discovers the convention spends the discovery, and its
# method may fit the instance. The plain pool, where correctness saturates, so the quality series carry the curve:
# solution_economy, turn_economy and method_transfer beside task_pass_rate, paired per batch and per lesson.
#
# Ids are W&B Inference ids as listed on 2026-09-12; `hgi experiment models` lists today's.
name = "economy"
description = "the stream graded on solution quality: economy of calls and turns, and method transfer to a twin world"
weave_project = "hgi-experiments"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[defaults]
model = "gpt-oss-120b"
passes_per_round = 2
concurrency = 6

[defaults.stream]
families = ["curriculum"]
batch = 8
batches = 10
seed = 2
revisit = [1, 2]

[defaults.stream.faults]
http_fault_fraction = 0.0

[arms.attached]
mode = "attached"

[arms.detached]
mode = "detached"
description = "the ablation on the same batches: the cost of every discovery, every time"
