# The incidents stream: eighteen diagnoses met three at a time, none of them seen before. The pool is the nine
# tenant-incident bundles and their nine re-dressed halves, dealt into six batches of three balanced over the decoy
# shapes the bundles turn on (`decoy-dependency`, `decoy-saturation`, `decoy-state`); pass k evaluates batch k at
# first sight, closes on it, and consolidates each round, so every batch is a validation set once and training
# afterwards. The transfer half is in the same pool, so a re-dressed scenario can arrive before or after its source:
# when it arrives after, the pass is asked whether the convention transferred; when it arrives first, the source is.
# `upstream-outage-b` is the pool class's control — a timeout storm with a genuinely saturated pool whose saturation
# is a consequence — and fails any record that learned "timeout storm ⇒ pool exhaustion" rather than the convention.
# Two batches are met again after the stream, which measures retention against transfer.
#
# Unlike the curriculum stream this world still faults: half the tasks lose their first HTTP call. The budget is the
# cause readings plus two and the naive walk down the whole bundle dies on it, so the slack must pay for the retry —
# with the faults off the budget would stop biting and the walk would be free to wander.
#
# `solution_economy` here is the step count: the knowing floor is one call per cause reading, so the score is that
# floor over the calls the pass actually spent — a pass that reads the two readings that settle it scores above one
# that reads eight and happens to be right.
#
# Ids are W&B Inference ids as listed on 2026-09-12; `hgi experiment models` lists today's.
name = "incidents"
description = "first-sight diagnosis of unseen incident bundles as the store grows, attached against detached, per decoy shape"
weave_project = "hgi-experiments"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[models.gpt-oss-20b]
id = "openai/gpt-oss-20b"

[defaults]
model = "gpt-oss-120b"
passes_per_round = 2
concurrency = 4

[defaults.stream]
families = ["incidents"]
batch = 3
batches = 12
seed = 0
revisit = [1, 2]

[defaults.stream.faults]
http_fault_fraction = 0.5
http_fault_calls = 1

[arms.120b-attached]
mode = "attached"

[arms.120b-detached]
mode = "detached"
description = "the ablation on the same batches; one run is the whole record"

[arms.20b-attached]
model = "gpt-oss-20b"
description = "a weaker actor on the same stream, likelier to reach for the loud reading on first contact"

[arms.split-roles]
model = "gpt-oss-20b"
description = "the weak actor with the strong backward pass: does separation of powers let it learn from a stronger judge"
[arms.split-roles.roles]
consolidator = "gpt-oss-120b"
examiner = "gpt-oss-120b"
adjudicator = "gpt-oss-120b"
coder = "gpt-oss-120b"
