# The incidents stream: the loop meets unseen diagnoses in progression. The pool is the nine tenant-incident bundles
# worn four ways each — 36 tasks — dealt into twelve batches of three, balanced over the three decoy shapes the bundles
# turn on (`decoy-dependency`, `decoy-saturation`, `decoy-state`); pass k meets batch k at first sight, closes on it,
# and consolidates every two batches, so every batch is a validation set once and training afterwards. The detached arm
# meets the same batches with no store, so the comparison is paired per batch and per lesson. Two batches are met again
# after the stream, which measures retention against transfer. The clothes of one scenario are spread across the deal,
# so a re-dressed bundle arrives after its source and a record that memorised `pool-debug` or `orders` or port `8080`
# transfers to none of them while one that learned the convention transfers to all.
#
# The lesson of this world is the shape of the decoy: the loud reading is the wrong one. `upstream-outage-b` is the
# pool class's built-in look-alike control — a timeout storm with a genuinely saturated pool whose saturation is a
# consequence of provider latency — so a record admitted as "saturated pool ⇒ pool exhaustion" fires there and must be
# set aside; that disposal is what splits the generic record from the convention.
#
# `solution_economy` here is the step count: the knowing floor is one call per cause reading, so the score is that
# floor over the calls the pass actually spent — a pass that reads the two readings that settle it scores above one
# that reads eight and happens to be right.
#
# The world faults nothing. The slack is one call, and a transient fault would eat the only spare probe, so the budget
# must mean exactly one thing: one wrong turn, no more. The retry lesson belongs to `genesis`, not to this family.
#
# The sweep is three actors on the same twelve batches, each attached against its own detached ablation, so every
# comparison is paired per batch and per lesson inside one actor and no arm's curve is read against another model's:
# `gpt-oss-120b` is the reference, `Llama-3.3-70B-Instruct` the closest same-class peer to it, and `gpt-oss-20b` at
# `reasoning_effort = "low"` the weak actor — the one likeliest to open the loud reading first, which is the failure
# this family is built to catch. The seventh arm asks the separation-of-powers question on top of the weak actor:
# the same 20b pass with `DeepSeek-V4-Pro` on the whole backward pass, so what a strong judge teaches a weak actor
# is read against `student-attached`, which differs from it in nothing but the judge. That question is split in two,
# because the judge is a model and not an idea: `student-strong-judge` puts `DeepSeek-V4-Pro` on the backward pass and
# `student-120b-judge` puts `gpt-oss-120b` there — the judge this endpoint has already admitted records under — so a
# flat curve can be read as the teaching failing rather than as the judge admitting nothing.
#
# `120b-strict` and `120b-strict-detached` are dropped. The strict pool budgets exactly the cause readings, which
# only separates passes that spend the slack — and the detached run showed no actor spends it: every failure was the
# naive walk dying on the budget it already had, not a pass that opened one decoy and ran one call over. With no
# actor spending the slack, taking the slack away cannot separate anything, so the pair bought two arms of run time
# and no reading. The `incidents-strict` family stays, and the seeded strict twin below is the only arm that runs it —
# there the question is not whether slack separates but whether an injected shape keeps the walk inside the budget.
#
# Ids are W&B Inference ids as listed on 2026-09-12; `hgi experiment models` lists today's.
name = "incidents"
description = "first-sight diagnosis of unseen incident bundles as the store grows, attached against detached, per decoy shape"
weave_project = "hgi-experiments"

[models.gpt-oss-120b]
id = "openai/gpt-oss-120b"

[models.gpt-oss-20b-low]
id = "openai/gpt-oss-20b"
reasoning_effort = "low"

[models.llama-70b]
id = "meta-llama/Llama-3.3-70B-Instruct"

[models.deepseek-v4]
id = "deepseek-ai/DeepSeek-V4-Pro-0813"

[defaults]
model = "gpt-oss-120b"
passes_per_round = 2
concurrency = 4

[defaults.stream]
families = ["incidents"]
batch = 3
batches = 12
seed = 0
revisit = [1, 2]

[defaults.stream.faults]
http_fault_fraction = 0.0

[arms.120b-attached]
mode = "attached"

[arms.120b-detached]
mode = "detached"
description = "the ablation on the same batches; one run is the whole record"

[arms.peer-attached]
model = "llama-70b"
mode = "attached"
description = "the closest same-class peer to gpt-oss-120b"

[arms.peer-detached]
model = "llama-70b"
mode = "detached"
description = "the closest same-class peer to gpt-oss-120b, ablated"

[arms.student-attached]
model = "gpt-oss-20b-low"
mode = "attached"
description = "a weaker actor at low reasoning effort, likelier to open the loud reading first"

[arms.student-detached]
model = "gpt-oss-20b-low"
mode = "detached"
description = "a weaker actor at low reasoning effort, likelier to open the loud reading first, ablated"

[arms.student-strong-judge]
model = "gpt-oss-20b-low"
description = "does a strong judge teach a weak actor"
[arms.student-strong-judge.roles]
consolidator = "deepseek-v4"
examiner = "deepseek-v4"
adjudicator = "deepseek-v4"
coder = "deepseek-v4"

[arms.student-120b-judge]
model = "gpt-oss-20b-low"
description = "the weak actor at low effort with gpt-oss-120b as the whole backward pass: the judge that has admitted records on this endpoint"
[arms.student-120b-judge.roles]
consolidator = "gpt-oss-120b"
examiner = "gpt-oss-120b"
adjudicator = "gpt-oss-120b"
coder = "gpt-oss-120b"

# The seeded twins: the same arms started from experiments/seeds/incidents — the three decoy shapes already admitted —
# against the unseeded arms above on the same batches. What the injected shapes buy, paired per batch.
[arms.120b-seeded]
mode = "attached"
seed = "incidents"
description = "gpt-oss-120b from the seed store: the decoy shapes already admitted"

[arms.120b-strict-seeded]
mode = "attached"
seed = "incidents"
description = "the strict pool from the seed store: does the injected shape keep the walk in budget"
[arms.120b-strict-seeded.stream]
families = ["incidents-strict"]
